<!DOCTYPE html>

<head>

<script>
  // Pasang tema sebelum halaman tergambar, supaya mode gelap tidak
  // berkedip terang lebih dulu saat dimuat.
  try {
    if (localStorage.getItem('presensiku.tema') === 'gelap') {
      document.documentElement.dataset.tema = 'gelap';
    }
  } catch { /* localStorage diblokir — biarkan mode terang */ }
</script>
<!-- Leaflet: peta asli. Bila offline, gagal dimuat dan aplikasi otomatis
     kembali memakai peta ilustratif (lihat petaTersedia() di peta.js). -->

<link rel="stylesheet" href="assets/css/tokens.css">

</head>

<a class="ke-admin" href="admin.html">Panel Admin →</a>

<div class="bezel">
  <div class="phone">

    <!-- Status bar tiruan, selalu di atas semua layar -->
    <div class="statusbar">
      <span class="jam" id="sbJam">07:30</span>
      <div class="kanan">
        <div class="sinyal">
          <i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i>
        </div>
        <span class="net">5G</span>
        <div class="baterai">
          <div class="body"><div class="isi"></div></div>
          <div class="tip"></div>
        </div>
      </div>
    </div>

    <!-- Seluruh layar dirender ke sini oleh app.js -->
    <main id="layar"></main>

    <!-- Bottom navigation (disembunyikan di layar Login, Selfie, Sukses, Form) -->
    <nav class="bottom-nav" id="nav" hidden></nav>

    <!-- Wadah notifikasi singkat -->

  </div>
</div>
