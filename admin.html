<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E2A47">
<title>Kompas — Panel Admin</title>
<link rel="icon" href="assets/logo-pu.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  try {
    if (localStorage.getItem('presensiku.tema') === 'gelap') {
      document.documentElement.dataset.tema = 'gelap';
    }
  } catch { /* localStorage diblokir — biarkan mode terang */ }
</script>
<!-- Leaflet: peta asli. Bila offline, gagal dimuat dan panel otomatis
     kembali memakai peta ilustratif (lihat petaTersedia() di peta.js). -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/tokens.css?v=20260728a">
<link rel="stylesheet" href="assets/css/admin.css?v=20260728a">
</head>
<body>

<!-- Gerbang masuk. Panel di bawahnya baru dirender setelah berhasil masuk. -->
<div id="gerbang" hidden></div>

<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="konten" id="konten"></div>
  </div>
</div>

<div id="modal"></div>
<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/icons.js?v=20260728a"></script>
<script src="assets/js/util.js?v=20260728a"></script>
<script src="assets/js/data.js?v=20260728a"></script>
<script src="assets/js/peta.js?v=20260728a"></script>
<script src="assets/js/admin.js?v=20260728a"></script>
<script>
  /* Pemeriksa versi.
     GitHub Pages menyimpan HTML di cache hingga 10 menit, sehingga halaman
     lama bisa terus memanggil aset lama meski versi baru sudah terbit —
     penanda ?v= pada aset jadi percuma karena HTML-nya sendiri basi.
     Berkas versi.json selalu diambil segar (no-store); bila berbeda,
     halaman dimuat ulang SEKALI dengan alamat baru supaya HTML ikut segar.
     Penjaga sessionStorage mencegah putaran muat-ulang tanpa henti. */
  (function () {
    var VERSI = '20260728a';
    fetch('versi.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (v) {
        if (!v || v.versi === VERSI) return;
        var kunci = 'presensiku.muatulang.' + v.versi;
        try {
          if (sessionStorage.getItem(kunci)) return;
          sessionStorage.setItem(kunci, '1');
        } catch (e) { return; }
        location.replace(location.pathname + '?v=' + v.versi);
      })
      .catch(function () { /* offline - pakai versi yang ada */ });
  })();
</script>
</body>
</html>
